name: AI Review Suite

on:
  pull_request:
    types: [opened, synchronize, reopened]

# The suite reads the org Actions secrets through `secrets: inherit`; an explicit
# list would drop the per-agent keys.
concurrency:
  group: ai-review-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    uses: orum/ai-agents/.gitea/workflows/reusable-review-suite.yml@main
    with:
      mender: true
    secrets: inherit
